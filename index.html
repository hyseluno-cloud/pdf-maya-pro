<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Configuración de viewport optimizada para evitar el desplazamiento lateral y permitir zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    
    <meta name="google-site-verification" content="aR5At_QjyOY1lb09NVlYBOHvn8OLfzipsDTKUvUa7iA" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3DC7SHETDV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3DC7SHETDV');

    <title>PDF MAYA PRO - Edición y Firma Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        background-color: #f1f5f9;
        /* Evita el scroll horizontal accidental que marea al usuario */
        overflow-x: hidden;
      }
      
      /* Optimizaciones de interacción táctil */
      .touch-none {
        touch-action: none !important;
      }

      input, select, textarea {
        font-size: 16px !important;
      }

      /* Scrollbars elegantes */
      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

      /* Ajustes específicos para que los botones no se desborden en móviles */
      @media (max-width: 400px) {
        .mobile-btn-text {
          font-size: 8px !important;
        }
        .mobile-icon {
          width: 12px !important;
          height: 12px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
